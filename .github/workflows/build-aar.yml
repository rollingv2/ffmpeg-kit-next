name: build-aar
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'nama tag (contoh v8.1.0)'
        default: 'v8.1.0'
      flags:
        description: 'opsi android.sh (kosong = hanya tampilkan --help)'
        required: false
        default: ''

env:
  ANDROID_PLATFORM_VERSION: '34'
  ANDROID_BUILD_TOOLS_VERSION: '35.0.0'
  ANDROID_NDK_VERSION: '27.3.13750724'
  ANDROID_CMAKE_VERSION: '3.22.1'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: ambil tag dari repo asli
        env:
          REF: ${{ inputs.ref }}
        run: |
          git fetch https://github.com/arthenica/ffmpeg-kit-next.git "refs/tags/${REF}:refs/tags/${REF}"
          git checkout "${REF}"
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool pkg-config gettext autopoint \
            cmake bison meson ninja-build nasm yasm gperf ragel texinfo autogen \
            groff gtk-doc-tools libtasn1-6-dev tcl doxygen \
            gcc g++ make patch file findutils gawk rsync \
            python3 perl ruby curl wget git zip unzip xz-utils tar gzip sed grep diffutils \
            bash which
      - name: android sdk and ndk
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDK_MANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes 2>/dev/null | "${SDK_MANAGER}" --licenses >/dev/null || true
          "${SDK_MANAGER}" --install \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"
          {
            echo "ANDROID_SDK_ROOT=${SDK_ROOT}"
            echo "ANDROID_HOME=${SDK_ROOT}"
            echo "ANDROID_NDK_ROOT=${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          } >> "$GITHUB_ENV"
      - name: help
        run: ./android.sh --help || true
      - name: build
        if: ${{ inputs.flags != '' }}
        env:
          FLAGS: ${{ inputs.flags }}
        run: ./android.sh $FLAGS
      - name: log
        if: ${{ always() }}
        run: cat build.log || true
      - name: upload aar
        if: ${{ inputs.flags != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: aar
          path: prebuilt/**/*.aar
          if-no-files-found: warn
